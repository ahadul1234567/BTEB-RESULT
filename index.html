<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTEB Full-Screen Portal | Developer: Ahadul Islam</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--primary);
            overflow: hidden; /* ফুল স্ক্রিন রাখার জন্য স্ক্রলিং বন্ধ */
            display: flex;
            flex-direction: column;
        }

        /* মেইন কন্টেইনার */
        .main-wrapper {
            flex: 1; /* ফুটারের উপরের পুরো অংশ দখল করবে */
            width: 100%;
            position: relative;
            background: #fff;
        }

        /* বিটিইবি লাইভ সার্ভার আইফ্রেম */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ফুটার সেকশন */
        footer {
            background: #1e293b;
            color: #cbd5e1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            border-top: 2px solid var(--accent);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        /* লাইভ স্ট্যাটাস ইন্ডিকেটর */
        .live-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.7);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #10b981;
            pointer-events: none;
        }

        .dot {
            height: 7px;
            width: 7px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
    </style>
</head>
<body>

    <!-- মেইন কন্টেন্ট এলাকা (ফুল স্ক্রিন আইফ্রেম) -->
    <div class="main-wrapper">
        <iframe src="https://bteb.allresultnet.com/" title="BTEB Official Server"></iframe>
        
        <div class="live-indicator">
            <span class="dot"></span> Server Connected
        </div>
    </div>

    <!-- ফুটার সেকশন -->
    <footer>
        Developed and maintained MD AHADUL ISLAM
    </footer>

</body>
</html>
